[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CellGPS"
version = "0.0.6"
description = "CellGPS spatial topology analysis for spatial omics data."
readme = "README.md"
authors = [
    { name = "Taobo Hu", email = "taobo.hu@scilifelab.se" },
    { name = "Mengping Long", email = "mengping.long@scilifelab.se" },
    { name = "Mats Nilsson", email = "mats.nilsson@scilifelab.se" }
]
maintainers = [
    { name = "Taobo Hu", email = "taobo.hu@scilifelab.se" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "anndata>=0.10",
    "pandas>=1.3",
    "numpy>=1.21",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "scikit-learn>=1.0",
    "scipy>=1.7",
    "psutil>=5.8",
    "joblib>=1.1",
    "tqdm>=4.60",
    "pillow",
]

[project.optional-dependencies]
gpu = ["torch>=2.0"]
gui = ["pillow"]
xenium = [
    "pyXenium>=0.4.3",
    "h5py>=3.0",
]
visium = [
    "spatialdata_io>=0.3",
]
cli = ["rich"]
plot = ["pycirclize"]

[project.scripts]
cellgps-gui = "cellgps.gui.gui_app:main"

[project.urls]
Homepage = "https://github.com/Moldia/CellGPS"
Repository = "https://github.com/Moldia/CellGPS"
Source = "https://github.com/Moldia/CellGPS"
Documentation = "https://github.com/Moldia/CellGPS/tree/main/docs"
Preprint = "https://www.biorxiv.org/content/10.64898/2026.05.26.727847v1"
"Manuscript code" = "https://github.com/Moldia/CellGPS/tree/main/CellGPS%20manuscript"

[dependency-groups]
dev = [
    "build",
    "pre-commit",
    "ruff",
    "twine>=4.0.2",
]
test = [
    "anndata",
    "coverage[toml]>=7.6",
    "pytest",
    "pytest-cov",
]
doc = [
    "alabaster",
    "sphinx>=7.2",
    "sphinx-autodoc-typehints",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
testpaths = [
    "tests",
]

[tool.coverage.run]
source = [
    "cellgps",
]
omit = [
    "**/test_*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
src = [
    "src",
    "tests",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "RUF100",
    "UP",
    "W",
]
ignore = [
    "B008",
    "E501",
    "E731",
    "E741",
]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = [
    "F401",
]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py39, py310, py311, ruff

[testenv:ruff]
basepython = python
deps = ruff
commands = ruff check src/cellgps tests

[testenv]
setenv =
    PYTHONPATH = {toxinidir}/src

deps =
    pytest

commands = pytest tests
"""
